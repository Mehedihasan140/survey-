<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surveyra – Get paid for your opinions</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4FF;--card:#fff;--ink:#14123A;--mute:#615F8A;--line:#E2E0F5;--pri:#4B3BFF;--pri2:#3426D6;--deep:#1B1464;--sun:#FFC83D;--sunink:#3A2800;--ok:#0E9F6E;--bad:#D7384B;
--h:'Sora',system-ui,sans-serif;--b:'Manrope',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0C2B;--card:#171446;--ink:#ECEBFF;--mute:#A09FD0;--line:#2B2866;--pri:#7B6DFF;--pri2:#6A5BF5;--deep:#0A0820}}
:root[data-theme="dark"]{--bg:#0E0C2B;--card:#171446;--ink:#ECEBFF;--mute:#A09FD0;--line:#2B2866;--pri:#7B6DFF;--pri2:#6A5BF5;--deep:#0A0820}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--b)}
h1,h2,h3{font-family:var(--h);margin:0;line-height:1.12;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.logo{font:800 22px var(--h);display:flex;align-items:center;gap:9px}
.coin{width:24px;height:24px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 3px #E5A800;display:inline-grid;place-items:center;font:800 11px var(--h);color:var(--sunink);flex:none}
.coin.lg{width:44px;height:44px;font-size:20px}
.btn{background:var(--pri);color:#fff;border:0;padding:12px 22px;border-radius:12px;font-weight:700}
.btn:hover{background:var(--pri2)}
.btn.sun{background:var(--sun);color:var(--sunink)}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 14px;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;max-width:1120px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.meta{color:var(--mute);font-size:14px}
.hero{background:var(--deep);color:#fff;border-radius:0 0 36px 36px;padding-bottom:56px}
.hero .top{color:#fff}
.hero-in{max-width:1120px;margin:0 auto;padding:34px 22px 0;display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(34px,5.6vw,58px);color:#fff}
.hero p{color:#C9C6FF;font-size:18px;margin:18px 0 26px;max-width:480px}
.mock{background:var(--card);color:var(--ink);border-radius:20px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);transform:rotate(2deg)}
.mock .it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mock .it:last-child{border:0}
.tick{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);background:var(--card)}
.tick div{display:inline-block;padding:11px 0;animation:mq 50s linear infinite}
.tick span{margin:0 26px;font-size:14px;color:var(--mute)}.tick b{color:var(--ink)}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tick div{animation:none}}
.sec{max-width:1120px;margin:0 auto;padding:54px 22px 0}
.sec h2{font-size:clamp(26px,4vw,36px);margin-bottom:22px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.pay{display:flex;gap:10px;flex-wrap:wrap}.pay span{background:var(--card);border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-weight:700}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer}details p{color:var(--mute);margin:10px 0 0}
footer{max-width:1120px;margin:60px auto 0;padding:26px 22px 40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:14px}
footer a{color:var(--mute);margin-right:16px}
/* app shell */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.side .logo{padding:0 10px 18px}
.side button{background:none;border:0;text-align:left;padding:11px 14px;border-radius:12px;font-weight:700;color:var(--mute)}
.side button.on{background:var(--pri);color:#fff}
.side .out{margin-top:auto}
.page{padding:26px 28px 90px;max-width:900px;width:100%}
.page h2{font-size:28px;margin-bottom:18px}
.bal{background:var(--deep);color:#fff;border-radius:22px;padding:24px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center}
.bal b{font:800 clamp(34px,6vw,50px) var(--h);display:block;line-height:1}
.bal .meta{color:#B9B6F5}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sun);border-radius:9px;transition:width .3s}
.bal .bar{background:rgba(255,255,255,.18);width:220px;margin-top:8px}
.sv{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sv h3{font-size:17px;margin-bottom:4px}
.tag{font-size:12px;font-weight:700;background:var(--bg);padding:3px 10px;border-radius:99px;color:var(--pri)}
.rew{display:flex;align-items:center;gap:7px;font:700 18px var(--h)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
label.f{display:block;font-weight:700;margin:14px 0 5px;font-size:14px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.meth{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.meth button{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-weight:700;text-align:left}
.meth button.sel,.opt.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.ov{position:fixed;inset:0;background:rgba(10,8,32,.65);display:grid;place-items:center;padding:16px;z-index:40;overflow:auto}
.modal{background:var(--card);border-radius:22px;padding:24px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;margin:9px 0;background:var(--bg);font-weight:500}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--mute)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;z-index:60;font-weight:700}
.done{text-align:center;padding:10px 0}.done h3{font-size:26px;margin:12px 0 6px}
@media (max-width:820px){
 .hero-in{grid-template-columns:1fr}.mock{transform:none}
 .shell{display:block}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around}
 .side .logo,.side .out{display:none}
 .side button{padding:9px 8px;font-size:12px;text-align:center;flex:1}
 .page{padding:20px 16px 100px}
}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div>
<script>
/* ===== SAMPLE CONTENT (landing page only): replace with real data before launch ===== */
const FEED=["Rafiq K. withdrew $12.00 via bKash","Nusrat earned 250 coins","Mila withdrew $5.00 via PayPal","Tanvir earned 170 coins","Sadia withdrew $8.00 via Nagad","Hasan earned 90 coins","Arif withdrew $20.00 via Bitcoin"];
const PREVIEW=[["Everyday Shopping Habits",3,60],["Phones and Apps",4,90],["Food Delivery Preferences",4,80]];
/* ===== END SAMPLE CONTENT ===== */
const RATE=100,MIN_W=500;
const METHODS=[["bKash",500],["Nagad",500],["PayPal",1000],["Bitcoin",1500],["USDT",1500]];
let S=null,V="home",W=null,M="bKash",D={surveys:[],wd:[],log:[],board:[]};
const $=s=>document.querySelector(s);
const usd=c=>"$"+(c/RATE).toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
async function api(m,p,b){let r;
 try{r=await fetch(p,{method:m,headers:{"Content-Type":"application/json"},credentials:"same-origin",body:b?JSON.stringify(b):undefined})}
 catch(e){throw new Error("Cannot reach the server. Check your connection.")}
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok)throw Object.assign(new Error(j.error||"Something went wrong."),{status:r.status});return j}
async function load(){
 try{const [me,sv,wd,lg,bd]=await Promise.all([api("GET","/api/me"),api("GET","/api/surveys"),api("GET","/api/withdrawals"),api("GET","/api/ledger"),api("GET","/api/leaderboard")]);
  S=me.user;D={surveys:sv.items,wd:wd.items,log:lg.items,board:bd.items}}
 catch(e){if(e.status===401||!(S&&S.name))S=null;if(e.status!==401)toast(e.message)}}

function landing(){const f=FEED.concat(FEED).map(x=>`<span>${x}</span>`).join("");return `
<div class="hero"><div class="top"><div class="logo"><span class="coin">S</span>Surveyra</div><div class="row"><button class="btn ghost sm" style="color:#fff;border-color:#4a45a0" data-a="auth" data-m="login">Log in</button><button class="btn sun sm" data-a="auth" data-m="signup">Join free</button></div></div>
<div class="hero-in"><div><h1>Get paid for what you already think.</h1><p>Short surveys from real brands. Answer honestly, collect coins instantly, and cash out to bKash, PayPal or crypto.</p>
<div class="row"><button class="btn sun" data-a="auth" data-m="signup">Start earning</button><span style="color:#C9C6FF;font-size:14px">Free to join. ${RATE} coins = $1.</span></div></div>
<div class="mock"><b style="font-family:var(--h)">Available now</b>${PREVIEW.map(s=>`<div class="it"><div><b>${s[0]}</b><div class="meta">${s[1]} min</div></div><div class="rew"><span class="coin">C</span>${s[2]}</div></div>`).join("")}</div></div></div>
<div class="tick"><div>${f}</div></div>
<div class="sec"><h2>Earn in three steps</h2><div class="grid g3">
<div class="card"><h3>1. Join</h3><p class="meta">Sign up with your email. You get 50 coins as a welcome bonus.</p></div>
<div class="card"><h3>2. Answer</h3><p class="meta">Every survey shows its length and reward before you start.</p></div>
<div class="card"><h3>3. Cash out</h3><p class="meta">Withdraw from ${usd(MIN_W)}. Requests are reviewed by our team.</p></div></div></div>
<div class="sec"><h2>Withdraw your way</h2><div class="pay">${METHODS.map(m=>`<span>${m[0]}</span>`).join("")}</div></div>
<div class="sec"><h2>Questions</h2>
<details><summary>Is it really free?</summary><p>Yes. You never pay to join or to withdraw.</p></details>
<details><summary>How fast do I get coins?</summary><p>Coins are added to your balance as soon as a survey is accepted.</p></details>
<details><summary>What is the minimum withdrawal?</summary><p>${MIN_W} coins (${usd(MIN_W)}) for mobile wallets. PayPal and crypto have higher minimums.</p></details>
<details><summary>Can I have more than one account?</summary><p>No. One person, one account. Duplicate accounts are closed.</p></details></div>
<footer><div>© 2026 Surveyra. All rights reserved.</div><div><a href="#">Terms</a><a href="#">Privacy</a><a href="#">Support</a></div></footer>`}

function dash(){const pr=(S.earned%300)/3,open=D.surveys.filter(s=>!s.done).slice(0,3);
return `<div class="bal"><div><span class="meta">Your balance</span><b>${S.coins.toLocaleString()}</b><span class="meta">≈ ${usd(S.coins)}</span></div>
<div><span class="meta">Level ${S.level}</span><div class="bar"><i style="width:${pr}%"></i></div><span class="meta">${300-S.earned%300} coins to level ${S.level+1}</span></div></div>
<div class="card row between" style="margin:16px 0"><div><h3>Daily bonus</h3><span class="meta">${S.streak?S.streak+"-day streak. ":""}Come back every day to grow your bonus.</span></div><button class="btn sun" data-a="bonus" ${S.bonusReady?"":"disabled"}>${S.bonusReady?"Claim daily bonus":"Come back tomorrow"}</button></div>
<div class="row between" style="margin:26px 0 12px"><h3>Top surveys for you</h3><button class="btn ghost sm" data-a="nav" data-v="surveys">See all</button></div>
<div class="grid">${open.map(sv).join("")||'<div class="card meta">You finished everything for now. New surveys arrive regularly.</div>'}</div>`}
function sv(s){return `<div class="card sv"><div><h3>${esc(s.title)}</h3><span class="tag">${esc(s.cat)}</span> <span class="meta">${s.minutes} min</span></div>
<div class="row"><div class="rew"><span class="coin">C</span>${s.coins}</div><button class="btn sm" data-a="start" data-id="${s.id}" ${s.done?"disabled":""}>${s.done?"Completed":"Start"}</button></div></div>`}
const surveys=()=>`<h2>Surveys</h2><div class="grid">${D.surveys.map(sv).join("")||'<div class="card meta">No surveys available right now.</div>'}</div>`;
function withdraw(){const min=METHODS.find(m=>m[0]==M)[1];
return `<h2>Withdraw</h2><div class="grid g2"><div class="card"><h3>Cash out</h3>
<label class="f">Method</label><div class="meth">${METHODS.map(m=>`<button class="${M==m[0]?"sel":""}" data-a="meth" data-m="${m[0]}">${m[0]}<div class="meta">min ${usd(m[1])}</div></button>`).join("")}</div>
<label class="f" for="wa">Coins (min ${min})</label><input id="wa" type="number" inputmode="numeric" placeholder="${min}">
<label class="f" for="wd">${M=="bKash"||M=="Nagad"?"Mobile number":M=="PayPal"?"PayPal email":"Wallet address"}</label><input id="wd">
<div class="err" id="we"></div><button class="btn" style="width:100%" data-a="wd">Request withdrawal</button></div>
<div class="card wrap"><h3>History</h3>${D.wd.length?`<table>${D.wd.map(w=>`<tr><td>${w.created.slice(0,10)}</td><td>${esc(w.method)}</td><td>${usd(w.coins)}</td><td><span class="tag" style="text-transform:capitalize">${w.status}</span></td></tr>`).join("")}</table>`:`<p class="meta">Your withdrawals will appear here.</p>`}</div></div>`}
function refer(){const l=location.origin+"/?ref="+S.code;
return `<h2>Invite friends</h2><div class="card"><p>Earn <b>10%</b> of every coin your friends earn. It never reduces their earnings.</p><label class="f" for="rl">Your link</label><div class="row"><input id="rl" readonly value="${esc(l)}" style="flex:1;min-width:200px"><button class="btn" data-a="copy">Copy link</button></div></div>`}
function board(){return `<h2>Leaderboard</h2><div class="card wrap"><table><tr><th>Rank</th><th>Member</th><th>Coins earned</th></tr>${D.board.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td><b>${r.earned.toLocaleString()}</b></td></tr>`).join("")}</table></div>`}
function account(){return `<h2>Account</h2><div class="card"><h3>${esc(S.name)}</h3><p class="meta">${esc(S.email)}</p></div>
<h3 style="margin:24px 0 12px">Activity</h3><div class="card wrap">${D.log.length?`<table>${D.log.map(l=>`<tr><td>${l.created.slice(0,10)}</td><td>${esc(l.reason)}</td><td><b>${l.delta>0?"+":""}${l.delta}</b></td></tr>`).join("")}</table>`:'<p class="meta">No activity yet.</p>'}</div>`}

function shell(){const T=[["home","Home"],["surveys","Surveys"],["withdraw","Withdraw"],["refer","Invite"],["board","Ranks"],["acct","Account"]];
const P={home:dash,surveys,withdraw,refer,board,acct:account}[V]();
return `<div class="shell"><aside class="side"><div class="logo"><span class="coin">S</span>Surveyra</div>${T.map(t=>`<button class="${V==t[0]?"on":""}" data-a="nav" data-v="${t[0]}">${t[1]}</button>`).join("")}<button class="out" data-a="out">Log out</button></aside><div class="page">${P}</div></div>`}

function authM(m){const su=m=="signup";return `<div class="ov" data-a="ovl"><div class="modal" role="dialog" aria-modal="true"><div class="row between"><h3>${su?"Create your account":"Welcome back"}</h3><button class="x" data-a="close" aria-label="Close">×</button></div>
${su?'<label class="f" for="an">Name</label><input id="an" autocomplete="name">':""}<label class="f" for="ae">Email</label><input id="ae" type="email" autocomplete="email">
<label class="f" for="ap">Password</label><input id="ap" type="password" autocomplete="${su?"new-password":"current-password"}"><div class="err" id="ar"></div>
<button class="btn" style="width:100%" data-a="doauth" data-m="${m}">${su?"Join and get 50 coins":"Log in"}</button></div></div>`}
function wiz(){const s=W.s,n=s.q.length;
if(W.i>=n)return `<div class="ov" data-a="ovl"><div class="modal done"><span class="coin lg">C</span><h3>+${W.won} coins</h3><p class="meta">Survey accepted. Your balance is now ${S.coins.toLocaleString()} coins.</p><button class="btn" style="width:100%" data-a="close">Back to surveys</button></div></div>`;
const q=s.q[W.i];return `<div class="ov" data-a="ovl"><div class="modal" role="dialog" aria-modal="true"><div class="row between"><b>${esc(s.title)}</b><button class="x" data-a="close" aria-label="Close">×</button></div>
<div class="bar" style="margin:12px 0 6px"><i style="width:${W.i/n*100}%"></i></div><p class="meta" style="margin:0 0 14px">Question ${W.i+1} of ${n}</p><h3>${esc(q[0])}</h3>
${q[1].map((o,j)=>`<button class="opt ${W.a[W.i]===j?"sel":""}" data-a="pick" data-j="${j}">${esc(o)}</button>`).join("")}
<div class="err">${esc(W.err||"")}</div>
<div class="row between" style="margin-top:8px"><button class="btn ghost" data-a="prev" ${W.i?"":"disabled"}>Back</button><button class="btn" data-a="next" ${W.a[W.i]==null||W.busy?"disabled":""}>${W.i==n-1?"Finish and collect":"Next"}</button></div></div></div>`}

function draw(){$("#app").innerHTML=S?shell():landing()}
function drawM(h){$("#modal").innerHTML=h||""}
document.addEventListener("click",async e=>{
 const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,d=el.dataset;
 try{
 if(a=="ovl"){if(e.target===el){W=null;drawM("")}return}
 if(a=="close"){W=null;drawM("");return}
 if(a=="auth"){drawM(authM(d.m));return}
 if(a=="doauth"){const er=$("#ar"),em=$("#ae").value.trim(),pw=$("#ap").value,nm=$("#an")?$("#an").value.trim():"";
  if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent="Enter a valid email address.";return}
  if(pw.length<6){er.textContent="Password must be at least 6 characters.";return}
  if(d.m=="signup"&&nm.length<2){er.textContent="Enter your name.";return}
  el.disabled=true;
  try{await api("POST",d.m=="signup"?"/api/signup":"/api/login",{name:nm,email:em,password:pw,ref:new URLSearchParams(location.search).get("ref")||undefined});
   await load();V="home";drawM("");draw()}
  catch(x){er.textContent=x.message;el.disabled=false}return}
 if(a=="pick"){W.a[W.i]=+d.j;W.err="";drawM(wiz());return}
 if(a=="prev"){W.i--;W.err="";drawM(wiz());return}
 if(a=="next"){const n=W.s.q.length;
  if(W.i<n-1){W.i++;W.err="";drawM(wiz());return}
  W.busy=true;W.err="";drawM(wiz());
  try{const r=await api("POST",`/api/surveys/${W.s.id}/complete`,{answers:W.a});W.busy=false;W.won=r.earned;W.i=n;await load();draw()}
  catch(x){W.busy=false;W.err=x.message}
  drawM(wiz());return}
 if(a=="start"){const r=await api("POST",`/api/surveys/${d.id}/start`);
  W={s:{id:r.survey.id,title:r.survey.title,coins:r.survey.coins,q:r.survey.questions},i:0,a:[],err:""};drawM(wiz());return}
 if(a=="nav"){V=d.v;await load()}
 else if(a=="out"){await api("POST","/api/logout");S=null}
 else if(a=="bonus"){const r=await api("POST","/api/bonus");toast("+"+r.earned+" coins");await load()}
 else if(a=="meth"){M=d.m}
 else if(a=="wd"){const er=$("#we"),min=METHODS.find(m=>m[0]==M)[1],c=parseInt($("#wa").value,10),ac=$("#wd").value.trim();
  if(!c||c<min){er.textContent="Minimum for "+M+" is "+min+" coins.";return}
  if(!ac){er.textContent="Enter your payout details.";return}
  try{await api("POST","/api/withdraw",{method:M,coins:c,account:ac});toast("Withdrawal requested");await load()}
  catch(x){er.textContent=x.message;return}}
 else if(a=="copy"){const i=$("#rl");i.select();try{navigator.clipboard.writeText(i.value)}catch(x){}toast("Link copied");return}
 draw();
 }catch(x){if(x.status===401){S=null;draw()}else toast(x.message)}});
